services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_postgres_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-academic_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change_this_rabbitmq_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  academic-service:
    build:
      context: ./academic-service
      dockerfile: Dockerfile
    container_name: academic-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_PORT: ${SERVER_PORT:-8080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-academic_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_postgres_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change_this_rabbitmq_password}
      ACADEMIC_EVENTS_EXCHANGE: ${ACADEMIC_EVENTS_EXCHANGE:-academic.events.exchange}
      ACADEMIC_EVENTS_QUEUE: ${ACADEMIC_EVENTS_QUEUE:-academic.events.queue}
      ACADEMIC_RESOURCE_COMPLETED_ROUTING_KEY: ${ACADEMIC_RESOURCE_COMPLETED_ROUTING_KEY:-academic.resource.completed}
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy

  web-gateway-service:
    build:
      context: ./web-gateway-service
      dockerfile: Dockerfile
    container_name: web-gateway-service
    restart: always
    environment:
      WEB_GATEWAY_PORT: ${WEB_GATEWAY_PORT:-3000}
      ACADEMIC_SERVICE_URL: ${ACADEMIC_SERVICE_URL:-http://academic-service:8080}
      GATEWAY_CORS_ORIGIN: ${GATEWAY_CORS_ORIGIN:-http://localhost:5173}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      academic-service:
        condition: service_started

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: recommendation-service
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  recommendation-worker:
    build:
      context: .
      dockerfile: recommendation-worker/Dockerfile
    container_name: recommendation-worker
    restart: always
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change_this_rabbitmq_password}
      ACADEMIC_EVENTS_EXCHANGE: ${ACADEMIC_EVENTS_EXCHANGE:-academic.events.exchange}
      ACADEMIC_EVENTS_QUEUE: ${ACADEMIC_EVENTS_QUEUE:-academic.events.queue}
      ACADEMIC_RESOURCE_COMPLETED_ROUTING_KEY: ${ACADEMIC_RESOURCE_COMPLETED_ROUTING_KEY:-academic.resource.completed}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
