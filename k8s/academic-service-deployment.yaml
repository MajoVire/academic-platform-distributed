apiVersion: apps/v1
kind: Deployment
metadata:
  name: academic-service
  namespace: academic-platform
  labels:
    app.kubernetes.io/name: academic-service
    app.kubernetes.io/part-of: academic-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: academic-service
      app.kubernetes.io/part-of: academic-platform
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: academic-service
        app.kubernetes.io/part-of: academic-platform
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: academic-service
          image: academic-platform/academic-service:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: SERVER_PORT
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: academic-platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: academic-platform-secrets
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: academic-platform-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: academic-platform-secrets
                  key: RABBITMQ_PASSWORD
            - name: ACADEMIC_EVENTS_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: ACADEMIC_EVENTS_EXCHANGE
            - name: ACADEMIC_EVENTS_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: ACADEMIC_EVENTS_QUEUE
            - name: ACADEMIC_RESOURCE_COMPLETED_ROUTING_KEY
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: ACADEMIC_RESOURCE_COMPLETED_ROUTING_KEY
            - name: RECOMMENDATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: RECOMMENDATION_SERVICE_URL
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: KEYCLOAK_ISSUER_URI
            - name: KEYCLOAK_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: KEYCLOAK_JWK_SET_URI
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
