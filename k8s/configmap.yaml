apiVersion: v1
kind: ConfigMap
metadata:
  name: academic-platform-config
  namespace: academic-platform
  labels:
    app.kubernetes.io/name: academic-platform
    app.kubernetes.io/part-of: academic-platform
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: academic_platform
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  SPRING_PROFILES_ACTIVE: postgres
  SERVER_PORT: "8080"
  ACADEMIC_SERVICE_URL: http://academic-service:8080
  RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
  ACADEMIC_EVENTS_EXCHANGE: academic.events.exchange
  ACADEMIC_EVENTS_QUEUE: academic.events.queue
  ACADEMIC_RESOURCE_COMPLETED_ROUTING_KEY: academic.resource.completed
  ACADEMIC_NOTIFICATIONS_EXCHANGE: academic.notifications.exchange
  ACADEMIC_RECOMMENDATION_GENERATED_ROUTING_KEY: academic.recommendation.generated
  WEB_GATEWAY_PORT: "3000"
  GATEWAY_CORS_ORIGIN: http://localhost:5173
  REQUEST_TIMEOUT_MS: "5000"
  NODE_ENV: production
  RABBITMQ_CONNECTION_ATTEMPTS: "5"
  RABBITMQ_CONNECTION_RETRY_DELAY_SECONDS: "5"
  RECOMMENDATION_WORKER_REQUEUE_ON_FAILURE: "false"
  RECOMMENDATION_WORKER_ACADEMIC_SERVICE_TIMEOUT_SECONDS: "2"
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/academic-platform
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/academic-platform/protocol/openid-connect/certs
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
  KC_HEALTH_ENABLED: "true"
  KC_HOSTNAME: http://localhost:8180
  KC_SPI_THEME_LOGIN_THEME: academic
