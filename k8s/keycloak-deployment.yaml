apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: academic-platform
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: academic-platform
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/part-of: academic-platform
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: academic-platform
        app.kubernetes.io/component: auth
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          imagePullPolicy: IfNotPresent
          command:
            - /opt/keycloak/bin/kc.sh
          args:
            - start-dev
            - --import-realm
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          env:
            - name: KC_DB
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: KC_DB
            - name: KC_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: KC_DB_URL
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: academic-platform-secrets
                  key: KC_DB_USERNAME
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: academic-platform-secrets
                  key: KC_DB_PASSWORD
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: academic-platform-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: academic-platform-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: KC_HEALTH_ENABLED
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: KC_HOSTNAME
            - name: KC_SPI_THEME_LOGIN_THEME
              valueFrom:
                configMapKeyRef:
                  name: academic-platform-config
                  key: KC_SPI_THEME_LOGIN_THEME
          volumeMounts:
            - name: keycloak-realm-import
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
              readOnly: true
            - name: keycloak-theme
              mountPath: /opt/keycloak/themes
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
      volumes:
        - name: keycloak-realm-import
          configMap:
            name: keycloak-realm-config
            items:
              - key: realm-export.json
                path: realm-export.json
        - name: keycloak-theme
          configMap:
            name: keycloak-theme-config
            items:
              - key: theme.properties
                path: academic/login/theme.properties
              - key: custom-styles.css
                path: academic/login/resources/css/custom-styles.css
              - key: script.js
                path: academic/login/resources/js/script.js
