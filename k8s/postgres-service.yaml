apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: academic-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: academic-platform
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: academic-platform
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
